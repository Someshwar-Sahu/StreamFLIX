<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base circle with a vibrant, bright blue color -->
  <circle cx="50" cy="50" r="46" fill="#3A86FF"/>

  <!-- Oversized round glasses frames in stark white -->
  <circle cx="34" cy="46" r="14" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="66" cy="46" r="14" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Glasses bridge connecting the frames -->
  <line x1="48" y1="46" x2="52" y2="46" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Simple dot eyes looking straight ahead -->
  <circle cx="34" cy="46" r="4" fill="#03045E"/>
  <circle cx="66" cy="46" r="4" fill="#03045E"/>

  <!-- A relaxed, neutral flat mouth -->
  <line x1="42" y1="72" x2="58" y2="72" stroke="#03045E" stroke-width="4" stroke-linecap="round"/>
</svg>
