<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base circle with a calming dark forest green color -->
  <circle cx="50" cy="50" r="46" fill="#1B4332"/>

  <!-- Facial features in deep warm orange for strong contrast -->
  
  <!-- Content/sleepy closed eyes (eyelids) -->
  <path d="M 32 50 Q 38 56 44 50" stroke="#E85D04" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 56 50 Q 62 56 68 50" stroke="#E85D04" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Small, simple centered mouth line for a neutral/content expression -->
  <line x1="46" y1="72" x2="54" y2="72" stroke="#E85D04" stroke-width="4" stroke-linecap="round"/>
</svg>
